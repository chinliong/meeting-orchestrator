# Local one-command startup: `docker compose up --build`
# Frontend on http://localhost:3000, backend on http://localhost:8000.
# Set GEMINI_API_KEY in a root .env file (see .env.example) before running.
services:
  backend:
    build:
      context: ./backend
      # Set INSTALL_AUDIO=true to bake the Whisper STT layer into the image.
      args:
        INSTALL_AUDIO: "false"
    ports:
      - "8000:8000"
    environment:
      GEMINI_API_KEY: ${GEMINI_API_KEY:?set GEMINI_API_KEY in .env}
      GEMINI_MODEL: ${GEMINI_MODEL:-gemini-3.5-flash}
      AUTH_SECRET: ${AUTH_SECRET:-dev-insecure-secret-change-me-in-production}
      DATABASE_URL: ${DATABASE_URL:-sqlite:////data/orchestrator.db}
    volumes:
      - backend_data:/data

  frontend:
    build:
      context: ./frontend
      args:
        # Baked into the client bundle; must be the URL the browser can reach.
        NEXT_PUBLIC_API_BASE: http://localhost:8000/api/v1
    ports:
      - "3000:3000"
    depends_on:
      - backend

volumes:
  backend_data:
