# Runs on every push to master and on every pull request: the backend test suite, the evaluation
# framework's unit tests, a type-checked production build of the frontend, and the browser suites
# against a fake backend. None of them calls a model API (the model is mocked or simulated), so no
# secrets are needed and nothing is charged.
name: CI

on:
  push:
    branches: [master]
  pull_request:

jobs:
  backend:
    name: Backend and evaluation tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.11"   # as in backend/Dockerfile
          cache: pip
          cache-dependency-path: |
            backend/requirements.txt
            backend/requirements-dev.txt
      - name: Install dependencies
        run: pip install -r backend/requirements.txt -r backend/requirements-dev.txt
      - name: Lint (unused imports, undefined names)
        run: ruff check backend/app backend/tests eval e2e --select F
      - name: Backend tests
        working-directory: backend
        run: python -m pytest -q
      - name: Evaluation framework unit tests
        run: python -m pytest eval -q

  frontend:
    name: Frontend type check and build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - name: Type check
        run: npx tsc --noEmit -p .
      - name: Production build
        run: npm run build

  browser:
    name: Browser tests (AI simulated)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: |
            backend/requirements.txt
            e2e/requirements.txt
      - name: Install the backend and Playwright
        run: |
          pip install -r e2e/requirements.txt
          python -m playwright install --with-deps chromium
      - uses: actions/setup-node@v7
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Build the frontend as it is deployed (a static export)
        working-directory: frontend
        env:
          NEXT_PUBLIC_API_BASE: http://127.0.0.1:8000/api/v1
        run: |
          npm ci
          npm run build
      - name: Serve the build
        run: |
          npx --yes serve@14.2.6 frontend/out --listen 3000 > /dev/null 2>&1 &
          for i in $(seq 1 30); do curl -sf http://localhost:3000/app > /dev/null && exit 0; sleep 1; done
          exit 1
      - name: Run the browser suites
        run: python e2e/run.py
      - name: Keep the screenshots of a failed run
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: browser-screenshots
          path: /tmp/meeting-orchestrator-e2e
