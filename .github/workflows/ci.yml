# Runs on every push to master and on every pull request: the backend test suite, the evaluation
# framework's unit tests, and a type-checked production build of the frontend. None of them calls
# a model API (the model is mocked in the tests), so no secrets are needed.
name: CI

on:
  push:
    branches: [master]
  pull_request:

jobs:
  backend:
    name: Backend and evaluation tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.11"   # as in backend/Dockerfile
          cache: pip
          cache-dependency-path: |
            backend/requirements.txt
            backend/requirements-dev.txt
      - name: Install dependencies
        run: pip install -r backend/requirements.txt -r backend/requirements-dev.txt
      - name: Lint (unused imports, undefined names)
        run: ruff check backend/app backend/tests eval --select F
      - name: Backend tests
        working-directory: backend
        run: python -m pytest -q
      - name: Evaluation framework unit tests
        run: python -m pytest eval -q

  frontend:
    name: Frontend type check and build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - name: Type check
        run: npx tsc --noEmit -p .
      - name: Production build
        run: npm run build
